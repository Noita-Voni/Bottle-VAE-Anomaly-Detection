[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bottle-vae-anomaly-detection"
version = "0.1.0"
description = "Phase 1 dataset validation for normal-only bottle anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bottle-data-check = "bottle_vae.data_check:main"

[tool.setuptools.packages.find]
where = ["src"]
